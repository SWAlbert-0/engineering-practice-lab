name: Container smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose
        run: |
          docker compose config --quiet
      - name: Build, start and wait for readiness
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Check six projects and offline APIs
        run: python3 scripts/container_smoke.py
      - name: Check runtime permissions and image contents
        run: |
          docker compose exec -T lab python -c "import os,pathlib; assert os.getuid()==10001; assert not pathlib.Path('/app/.env').exists(); assert not pathlib.Path('/app/.git').exists()"
          docker compose exec -T lab python -c "import pathlib,tempfile; t=tempfile.TemporaryDirectory(); pathlib.Path(t.name,'probe').write_text('ok'); t.cleanup()"
          docker compose exec -T lab python - <<'PYCODE'
          import errno
          from pathlib import Path
          try:
              Path('/app/write-probe').write_text('unexpected')
          except OSError as error:
              assert error.errno == errno.EROFS, error
          else:
              raise AssertionError('Container filesystem is writable')
          PYCODE
      - name: Unit and service regression tests
        run: |
          docker run --rm --read-only --tmpfs /tmp -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/suite:ro" -w /suite engineering-practice-lab:local python -m unittest discover -s tests -v
      - name: Verify D11 worker identity
        run: |
          python3 - <<'PYCODE'
          import json,urllib.request
          value=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/repair-workspace/workspace'))
          assert value['capabilities']['worker_uid']==10001,value['capabilities']
          assert value['capabilities']['ready'],value['capabilities']
          PYCODE
      - name: D11 real Docker isolation and cleanup
        run: |
          docker run --rm --user 0:10001 --read-only --tmpfs /tmp -e PYTHONDONTWRITEBYTECODE=1 -e LAB_REPAIR_DOCKER_TEST=1 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/suite:ro" -w /suite engineering-practice-lab:local python -m unittest discover -s tests -p test_repair_docker.py -v
      - name: Install browser acceptance tools
        run: |
          npm install --prefix /tmp/lab-browser --no-audit --no-fund playwright@1.62.1
          /tmp/lab-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: D01 real browser acceptance
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_process_browser.cjs
      - name: D09 real browser acceptance
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_requirements_browser.cjs
      - name: Redesigned workspace entry points
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_design_workspaces.cjs
      - name: D11 real browser acceptance
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_repair_browser.cjs
      - name: D13 real browser acceptance
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_literature_browser.cjs
      - name: D02 real browser acceptance
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_mlops_browser.cjs
      - name: D12 real browser acceptance
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: node tests/test_video_browser.cjs
      - name: Verify persistent workspace after restart
        env:
          NODE_PATH: /tmp/lab-browser/node_modules
        run: |
          docker compose restart lab
          docker compose up -d --wait --wait-timeout 90
          node tests/test_process_browser.cjs --check-persistence
          node tests/test_requirements_browser.cjs --check-persistence
          node tests/test_repair_browser.cjs --check-persistence
          node tests/test_literature_browser.cjs --check-persistence
          node tests/test_mlops_browser.cjs --check-persistence
          node tests/test_video_browser.cjs --check-persistence
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d01-browser-evidence
          path: /tmp/lab-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
