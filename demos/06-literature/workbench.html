<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献研读室工作台</title><link rel="stylesheet" href="../../shared/style.css"><link rel="stylesheet" href="../../shared/product/additional-workbenches.css"></head><body data-project="literature"><main class="task-workbench"><form id="task-form"><h1>文献研读流程</h1><p>使用固定摘记池，观察证据提取、综合与核查。</p><label for="input">研究问题</label><textarea id="input" rows="3" maxlength="500" required></textarea><fieldset id="papers"><legend>纳入的文献摘记</legend></fieldset><div class="task-options"><label for="mode">工作模式</label><select id="mode"><option value="offline">离线角色流程（0次模型调用）</option><option value="single" data-model>单次模型综合（1次调用）</option><option value="multi" data-model>并行阅读 + 综合（最多6次调用）</option></select><button id="run" type="submit">开始研读</button></div><p id="capability" class="help-text"></p></form><p id="status" role="status" aria-live="polite">准备就绪</p><div class="result-actions"><span id="run-context"></span><button id="export" class="secondary" type="button" disabled>导出JSON</button></div><section id="result" aria-label="运行结果"><p class="initial-hint">运行后显示本次实际结果，自动保存到项目记录。</p></section></main><script src="../../shared/ui.js"></script><script src="seed.js"></script><script src="../../shared/product/additional-workbenches.js"></script></body></html>
