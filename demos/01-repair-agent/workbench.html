<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测试与修复 · 工程实践</title><link rel="stylesheet" href="../../shared/style.css"><style>.main{margin:0;padding:8px;max-width:none}.implementation{margin-bottom:12px}body{overflow:hidden}</style><link rel="stylesheet" href="../../shared/product/workbench-themes.css"></head>
<body class="workbench-repair"><a class="skip-link" href="#main">跳到正文</a>

<main id="main" class="main "><div class="workspace"><form id="repair-form" class="panel"><div class="panel-head"><h2>测试配置</h2></div><div class="panel-body"><div class="field"><label for="case">缺陷样例</label><select id="case"><option value="boundary">运费计算：边界条件</option><option value="empty">平均值：空列表处理</option><option value="dedupe">列表去重：保留顺序</option></select></div><div class="field"><label for="candidate">候选补丁</label><select id="candidate"><option value="correct">正确候选</option><option value="wrong">错误候选</option></select><p class="field-note">错误候选包含过度简化的实现，用于检查测试能否拦截问题。</p></div><button id="run" class="full-width" type="submit">运行测试</button><p id="status" class="status" role="status" aria-live="polite">尚未运行。</p></div></form>
<div><p id="run-context" class="run-context"></p><div class="result-stack"><section class="panel"><div class="panel-head"><h2>验收结果</h2><button id="export" class="secondary" type="button" disabled>导出 JSON</button></div><dl class="readout"><div><dt>修复前</dt><dd id="before">—</dd></div><div><dt>候选回归</dt><dd id="after">—</dd></div><div><dt>独立用例</dt><dd id="held">—</dd></div><div><dt>补丁验收</dt><dd id="decision">—</dd></div></dl><div class="panel-body"><h3>需求说明</h3><p id="issue" class="muted">运行后显示该样例的预期行为。</p></div></section>
<section class="panel"><div class="panel-head"><h2>代码差异</h2><span class="muted">fixture.py</span></div><pre id="diff" class="diff">运行测试后显示候选补丁。</pre></section>
<section class="panel"><div class="panel-head"><h2>测试明细</h2><span class="muted">通过数量 / 用例总数</span></div><div class="table-wrap"><table><thead><tr><th>阶段</th><th>输入</th><th>预期</th><th>实际</th><th>结果</th></tr></thead><tbody id="tests"><tr><td colspan="5" class="empty">尚无测试结果。</td></tr></tbody></table></div></section></div></div></div><details class="implementation"><summary>实现说明</summary><p>程序在独立 Python 进程中执行内置可信样例，生成代码差异并运行测试。当前没有接入 LLM，也不接受任意仓库或代码。完整选题还需补充容器隔离、测试生成、覆盖率评估和至少 5 个开源项目的验证。</p></details></main><script src="../../shared/ui.js"></script><script src="app.js"></script></body></html>
