<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频采样与问答</title><link rel="stylesheet" href="../../shared/style.css"><link rel="stylesheet" href="video.css"></head><body><main class="video-workbench"><header><h1>视频采样与证据问答</h1><p>完整视频保留在浏览器；只有选择模型分析时，采样画面才会发送给已配置的模型。</p></header><div class="video-layout"><section><video id="player" src="sample.webm" controls preload="metadata" aria-label="待分析的视频"></video><div class="media-input"><label for="file">选择本地视频（最长10分钟）</label><input id="file" type="file" accept="video/*"><button id="sample-video" type="button" class="secondary">恢复内置样片</button></div><p id="material">内置原创样片 · 蓝色方块横向移动</p></section><form id="video-form"><label for="question">要从画面中回答的问题</label><textarea id="question" rows="3" maxlength="500" required>画面中的方块如何移动？哪些采样画面支持这个判断？</textarea><label for="frame-count">均匀采样帧数</label><select id="frame-count"><option value="2">2帧</option><option value="4" selected>4帧</option><option value="6">6帧</option></select><button id="sample" type="button">抽取采样帧</button><label for="mode">分析方式</label><select id="mode"><option value="offline">离线采样校验（无视觉推理）</option><option value="llm" disabled>多模态模型问答（会发送图像）</option></select><p id="capability">正在检查模型配置…</p><button id="analyze" type="submit" disabled>分析已采样画面</button></form></div><p id="status" role="status" aria-live="polite">等待视频元信息；预览后点击抽帧。</p><section><h2>采样时间线</h2><p class="help-text">点击缩略图可定位播放器。改变视频或帧数后需重新抽帧。</p><div id="frames" class="frame-grid"></div></section><section id="answer" aria-label="分析结果"></section></main><script src="../../shared/ui.js"></script><script src="app.js"></script></body></html>
