<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>塔防 · 工程实践</title><link rel="stylesheet" href="../../shared/style.css"><style>.main{margin:0;padding:8px;max-width:none}.implementation{margin-bottom:12px}body{overflow:hidden}</style></head>
<body><a class="skip-link" href="#main">跳到正文</a>

<main id="main" class="main "><div class="game-layout"><section class="game-board" aria-label="塔防游戏"><dl class="game-hud"><div><dt>基地耐久</dt><dd id="life">12</dd></div><div><dt>金币</dt><dd id="gold">160</dd></div><div><dt>波次</dt><dd id="wave">0 / 5</dd></div><div><dt>击败敌人</dt><dd id="kills">0</dd></div></dl><canvas id="game" width="900" height="500" aria-label="塔防地图，点击道路旁的空地建塔">此游戏需要支持 Canvas 的浏览器。</canvas><p id="status" class="game-status" role="status" aria-live="polite">先点击空地建塔，再开始第一波。</p></section><section class="panel game-controls"><div class="panel-head"><h2>建造与波次</h2></div><div class="panel-body"><div><div class="field"><label for="tower">防御塔</label><select id="tower"><option value="bolt">弩塔 · 50 金币</option><option value="frost">霜塔 · 70 金币</option></select></div><button id="next" class="full-width" type="button">开始第一波</button><div class="actions"><button id="pause" class="secondary" type="button">暂停</button><button id="reset" class="secondary" type="button">重开</button></div></div><div><div class="tower-key"><span class="tower-mark"></span><div><strong>弩塔</strong>单体伤害，射程 155。</div></div><div class="tower-key"><span class="tower-mark frost"></span><div><strong>霜塔</strong>减速控制，射程 135。</div></div><p class="note">道路上不能建塔。击败敌人和完成波次都可获得金币；转角附近能覆盖更长的路径。</p></div></div></section></div><details class="implementation"><summary>实现说明</summary><p>浏览器 Canvas 原型，使用固定时间步长和预设路径。当前包含两类塔、五波敌人、经济与胜负状态；没有接入游戏引擎、动态寻路、存档或关卡编辑器。</p></details></main><script src="../../shared/ui.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
