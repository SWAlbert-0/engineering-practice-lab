<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求设计台工作台</title><link rel="stylesheet" href="../../shared/style.css"><link rel="stylesheet" href="../../shared/product/additional-workbenches.css"></head><body data-project="requirements"><main class="task-workbench"><form id="task-form"><h1>需求提取与用例草案</h1><p>先保留原文，再检查角色、业务约束与待确认项。</p><label for="input">需求正文</label><textarea id="input" rows="9" maxlength="10000" required></textarea><div class="task-options"><label for="mode">处理模式</label><select id="mode"><option value="offline">离线规则与模板</option><option value="llm" data-model>模型提取 + 本地模板（1次调用）</option></select><button id="run" type="submit">开始分析</button></div><p id="capability" class="help-text"></p></form><p id="status" role="status" aria-live="polite">准备就绪</p><div class="result-actions"><span id="run-context"></span><button id="export" class="secondary" type="button" disabled>导出JSON</button></div><section id="result" aria-label="运行结果"><p class="initial-hint">运行后显示本次实际结果，自动保存到项目记录。</p></section></main><script src="../../shared/ui.js"></script><script src="../../shared/product/additional-workbenches.js"></script></body></html>
