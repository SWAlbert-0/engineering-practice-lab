name: engineering-practice-lab
services:
  lab:
    image: engineering-practice-lab:local
    build:
      context: .
      args:
        PIP_INDEX_URL: "${LAB_PIP_INDEX_URL:-https://pypi.org/simple}"
    ports:
      - "127.0.0.1:${LAB_PORT:-8765}:8765"
    environment:
      LAB_REPAIR_RUNNER: docker
      LAB_LLM_BASE_URL: "${LAB_LLM_BASE_URL:-}"
      LAB_LLM_MODEL: "${LAB_LLM_MODEL:-}"
      LAB_LLM_API_KEY: "${LAB_LLM_API_KEY:-}"
      LAB_EMBED_BASE_URL: "${LAB_EMBED_BASE_URL:-}"
      LAB_EMBED_MODEL: "${LAB_EMBED_MODEL:-}"
      LAB_EMBED_API_KEY: "${LAB_EMBED_API_KEY:-}"
    volumes:
      - process-data:/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  repair-image:
    image: engineering-practice-lab-repair:local
    build:
      context: .
      dockerfile: Dockerfile.repair
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  repair-worker:
    image: engineering-practice-lab:local
    pull_policy: never
    command: [python, scripts/repair_worker.py]
    user: "0:10001"
    environment:
      LAB_DATA_DIR: /data
      LAB_REPAIR_RUNNER: docker
      LAB_LLM_BASE_URL: "${LAB_LLM_BASE_URL:-}"
      LAB_LLM_MODEL: "${LAB_LLM_MODEL:-}"
      LAB_LLM_API_KEY: "${LAB_LLM_API_KEY:-}"
    volumes:
      - process-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      lab:
        condition: service_healthy
      repair-image:
        condition: service_completed_successfully
    init: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, scripts/repair_worker.py, --healthcheck]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  process-data:
